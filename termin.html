<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Manage demo booking – WorkPass">
  <title>Termin verwalten | WorkPass</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extras.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body class="theme-premium">
  <header class="header scrolled" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" id="manageHomeLogo">
        <img src="assets/logo.png" alt="Suppix AI UG" class="logo-img">
        <div class="logo-text">
          <span class="logo-platform">WorkPass</span>
          <span class="logo-sub" id="manageLogoSub">Termin</span>
        </div>
      </a>
      <nav class="nav-desktop">
        <a href="index.html" id="manageNavHome">Startseite</a>
        <a href="index.html#bookingSection" class="btn btn-primary" id="manageNavBook">Neu buchen</a>
      </nav>
    </div>
  </header>

  <main class="thanks-page" id="main">
    <div class="container thanks-card booking-manage-card">
      <h1 id="manageTitle">Termin verwalten</h1>
      <p class="thanks-lead" id="manageLead">Termin wird geladen …</p>
      <div id="manageDetails" class="booking-manage-details" hidden>
        <p><strong id="manageWhen"></strong></p>
        <p id="manageMeta" class="booking-slot-hint"></p>
      </div>
      <p class="form-status" id="manageStatus" role="status" aria-live="polite"></p>
      <div class="thanks-actions" id="manageActions" hidden>
        <button type="button" class="btn btn-outline" id="manageCancelBtn">Termin absagen</button>
        <a href="index.html#bookingSection" class="btn btn-primary" id="manageReschedule">Neuen Termin buchen</a>
      </div>
      <p class="booking-note" id="manageFallback" hidden>
        <span id="manageFallbackText">Kein gültiger Link.</span>
        <a href="index.html#bookingSection" id="manageFallbackBook">Demo neu buchen</a>
        <span id="manageFallbackOr">oder</span>
        <a href="mailto:info@suppixai.com">info@suppixai.com</a>.
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; <span data-year>2026</span> Suppix AI UG</span>
      <span><a href="impressum.html" id="manageLegalImprint">Impressum</a> · <a href="datenschutz.html" id="manageLegalPrivacy">Datenschutz</a></span>
    </div>
  </footer>

  <script src="site-config.js"></script>
  <script>
    (function () {
      const cfg = window.SITE_CONFIG || {};
      const api = String(cfg.bookingApiUrl || cfg.formApiUrl || "").replace(/\/$/, "");
      const params = new URLSearchParams(location.search);
      const token = (params.get("token") || "").trim();
      const lang = String(params.get("lang") || document.documentElement.lang || "de")
        .toLowerCase()
        .slice(0, 2);
      const isEn = lang === "en";
      const isAr = lang === "ar";
      const home =
        isAr ? "ar/index.html" : isEn ? "en/index.html" : "index.html";
      const bookHref = home + "#bookingSection";

      const i18n = {
        de: {
          title: "Termin verwalten",
          logoSub: "Termin",
          navHome: "Startseite",
          navBook: "Neu buchen",
          loading: "Termin wird geladen …",
          invalid: "Ungültiger Verwaltungslink.",
          cancelled: "Dieser Termin wurde bereits abgesagt.",
          yourBooking: "Ihr gebuchter Demo-Termin:",
          notFound: "Termin nicht gefunden oder Link abgelaufen.",
          cancelBtn: "Termin absagen",
          reschedule: "Neuen Termin buchen",
          fallback: "Kein gültiger Link.",
          fallbackBook: "Demo neu buchen",
          or: "oder",
          confirm: "Termin wirklich absagen?",
          cancelling: "Wird abgesagt …",
          cancelledOk: "Termin abgesagt.",
          emailFollows: "Bestätigung per E-Mail folgt. Sie können einen neuen Termin buchen.",
          cancelFail: "Absage fehlgeschlagen. Bitte E-Mail an info@suppixai.com.",
          imprint: "Impressum",
          privacy: "Datenschutz",
          htmlLang: "de",
          dir: "ltr",
          pageTitle: "Termin verwalten | WorkPass",
        },
        en: {
          title: "Manage booking",
          logoSub: "Booking",
          navHome: "Home",
          navBook: "Book again",
          loading: "Loading booking…",
          invalid: "Invalid management link.",
          cancelled: "This booking was already cancelled.",
          yourBooking: "Your booked demo:",
          notFound: "Booking not found or link expired.",
          cancelBtn: "Cancel booking",
          reschedule: "Book a new time",
          fallback: "No valid link.",
          fallbackBook: "Book a demo",
          or: "or",
          confirm: "Really cancel this booking?",
          cancelling: "Cancelling…",
          cancelledOk: "Booking cancelled.",
          emailFollows: "Email confirmation will follow. You can book a new time.",
          cancelFail: "Cancel failed. Please email info@suppixai.com.",
          imprint: "Imprint",
          privacy: "Privacy",
          htmlLang: "en",
          dir: "ltr",
          pageTitle: "Manage booking | WorkPass",
        },
        ar: {
          title: "إدارة الموعد",
          logoSub: "الموعد",
          navHome: "الرئيسية",
          navBook: "حجز جديد",
          loading: "جاري تحميل الموعد…",
          invalid: "رابط الإدارة غير صالح.",
          cancelled: "تم إلغاء هذا الموعد مسبقاً.",
          yourBooking: "موعد العرض المحجوز:",
          notFound: "الموعد غير موجود أو انتهت صلاحية الرابط.",
          cancelBtn: "إلغاء الموعد",
          reschedule: "حجز موعد جديد",
          fallback: "لا يوجد رابط صالح.",
          fallbackBook: "احجز عرضاً",
          or: "أو",
          confirm: "هل تريد إلغاء الموعد حقاً؟",
          cancelling: "جاري الإلغاء…",
          cancelledOk: "تم إلغاء الموعد.",
          emailFollows: "ستصلك رسالة تأكيد. يمكنك حجز موعد جديد.",
          cancelFail: "فشل الإلغاء. راسل info@suppixai.com.",
          imprint: "البيانات القانونية",
          privacy: "الخصوصية",
          htmlLang: "ar",
          dir: "rtl",
          pageTitle: "إدارة الموعد | WorkPass",
        },
      };
      const t = i18n[lang] || i18n.de;

      document.documentElement.lang = t.htmlLang;
      document.documentElement.dir = t.dir;
      document.title = t.pageTitle;

      const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      };
      const setHref = (id, href) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute("href", href);
      };

      setText("manageTitle", t.title);
      setText("manageLogoSub", t.logoSub);
      setText("manageNavHome", t.navHome);
      setText("manageNavBook", t.navBook);
      setText("manageLead", t.loading);
      setText("manageCancelBtn", t.cancelBtn);
      setText("manageReschedule", t.reschedule);
      setText("manageFallbackText", t.fallback);
      setText("manageFallbackBook", t.fallbackBook);
      setText("manageFallbackOr", t.or);
      setText("manageLegalImprint", t.imprint);
      setText("manageLegalPrivacy", t.privacy);
      setHref("manageHomeLogo", home);
      setHref("manageNavHome", home);
      setHref("manageNavBook", bookHref);
      setHref("manageReschedule", bookHref);
      setHref("manageFallbackBook", bookHref);

      const lead = document.getElementById("manageLead");
      const details = document.getElementById("manageDetails");
      const whenEl = document.getElementById("manageWhen");
      const metaEl = document.getElementById("manageMeta");
      const statusEl = document.getElementById("manageStatus");
      const actions = document.getElementById("manageActions");
      const fallback = document.getElementById("manageFallback");
      const cancelBtn = document.getElementById("manageCancelBtn");
      const year = document.querySelector("[data-year]");
      if (year) year.textContent = String(new Date().getFullYear());

      if (!token || !api) {
        lead.textContent = t.invalid;
        fallback.hidden = false;
        return;
      }

      fetch(api + "/booking/manage?token=" + encodeURIComponent(token))
        .then(function (r) {
          return r.json().then(function (d) {
            return { ok: r.ok, d: d };
          });
        })
        .then(function (res) {
          if (!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || "not found");
          const d = res.d;
          if (d.status === "cancelled") {
            lead.textContent = t.cancelled;
            whenEl.textContent = d.label || "";
            details.hidden = !d.label;
            actions.hidden = false;
            cancelBtn.hidden = true;
            return;
          }
          lead.textContent = t.yourBooking;
          whenEl.textContent = d.label || d.slotStart;
          metaEl.textContent = [d.demoType, d.paket, d.location, d.timezone].filter(Boolean).join(" · ");
          details.hidden = false;
          actions.hidden = false;
        })
        .catch(function () {
          lead.textContent = t.notFound;
          fallback.hidden = false;
        });

      cancelBtn.addEventListener("click", function () {
        if (!confirm(t.confirm)) return;
        cancelBtn.disabled = true;
        statusEl.textContent = t.cancelling;
        fetch(api + "/booking/manage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, action: "cancel" }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (!d.ok) throw new Error(d.error || "fail");
            lead.textContent = t.cancelledOk;
            statusEl.textContent = t.emailFollows;
            cancelBtn.hidden = true;
          })
          .catch(function () {
            statusEl.textContent = t.cancelFail;
            statusEl.classList.add("is-error");
            cancelBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
